<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body id="body" class="min-h-screen flex items-center justify-center p-4 bg-slate-900 text-white transition-colors duration-300">

  <div id="app" class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-6 transition-colors duration-300">
    
    <!-- Top Bar with Theme Selector -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-extrabold tracking-tight">Tic Tac Toe Pro</h1>
      <select id="theme-selector" class="bg-slate-700 text-sm p-2 rounded-lg text-white border border-slate-600 focus:outline-none">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
        <option value="cyberpunk">Cyberpunk</option>
        <option value="Prachi">Prachi</option>
      </select>
    </div>

    <p id="status-text" class="text-center text-slate-400 text-lg mb-6">Enter details to play</p>

    <!-- Lobby Menu -->
    <div id="lobby-container" class="space-y-6">
      <div class="bg-slate-700 p-4 rounded-xl space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Your Name:</label>
          <input type="text" id="player-name-input" placeholder="Enter your name" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Select Grid Size:</label>
          <select id="grid-size" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="3">3 x 3</option>
            <option value="4">4 x 4</option>
            <option value="5">5 x 5</option>
            <option value="6">6 x 6</option>
            <option value="7">7 x 7</option>
            <option value="8">8 x 8</option>
          </select>
        </div>

        <button id="create-btn" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl transition">
          Create New Game
        </button>
      </div>

      <div class="flex gap-2">
        <input type="text" id="room-input" placeholder="Enter Room Code" class="flex-1 bg-slate-700 px-4 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 uppercase">
        <button id="join-btn" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-6 py-2 rounded-xl transition">Join</button>
      </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden">
      
      <!-- Scoreboard -->
      <div class="grid grid-cols-3 gap-2 mb-6 text-center bg-slate-900 rounded-xl p-3 shadow-inner">
        <div class="flex flex-col">
          <span id="label-x" class="text-xs text-slate-400 uppercase font-bold truncate">Player X</span>
          <span id="score-x" class="text-2xl font-bold text-blue-400">0</span>
        </div>
        <div class="flex flex-col border-x border-slate-700">
          <span class="text-xs text-slate-400 uppercase font-bold">Draws</span>
          <span id="score-draws" class="text-2xl font-bold text-slate-300">0</span>
        </div>
        <div class="flex flex-col">
          <span id="label-o" class="text-xs text-slate-400 uppercase font-bold truncate">Player O</span>
          <span id="score-o" class="text-2xl font-bold text-pink-400">0</span>
        </div>
      </div>

      <div class="flex justify-between items-center mb-4">
        <span id="player-indicator" class="font-semibold text-blue-300"></span>
        <span id="room-display" class="bg-slate-700 px-3 py-1 rounded text-sm font-mono tracking-widest cursor-pointer hover:bg-slate-600" title="Click to copy code"></span>
      </div>
      
      <!-- Board Wrapper with SVG Line Overlay -->
      <div class="relative w-full max-w-[500px] aspect-square mx-auto my-2 flex items-center justify-center">
        <div id="board" class="grid gap-2 bg-slate-700 p-2 rounded-xl w-full h-full"></div>
        <svg id="strike-svg" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10">
          <line id="strike-line" x1="0" y1="0" x2="0" y2="0" stroke="#facc15" stroke-width="8" stroke-linecap="round" class="hidden" />
        </svg>
      </div>

      <button id="rematch-btn" class="w-full mt-6 bg-purple-600 hover:bg-purple-500 font-bold py-3 rounded-xl transition hidden">
        Play Next Round
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
