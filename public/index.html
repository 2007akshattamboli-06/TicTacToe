<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Tic Tac Toe Multiplayer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-900 text-white">

  <div id="app" class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-6">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold tracking-tight mb-2">Tic Tac Toe Pro</h1>
      <p id="status-text" class="text-slate-400 text-lg">Create or Join a Room</p>
    </div>

    <!-- Lobby Menu -->
    <div id="lobby-container" class="space-y-6">
      <div class="bg-slate-700 p-4 rounded-xl">
        <label class="block text-sm font-medium mb-2">Select Grid Size:</label>
        <select id="grid-size" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="3">3 x 3</option>
          <option value="4">4 x 4</option>
          <option value="5">5 x 5</option>
          <option value="6">6 x 6</option>
          <option value="7">7 x 7</option>
          <option value="8">8 x 8</option>
        </select>
        <button id="create-btn" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl transition">
          Create New Game
        </button>
      </div>

      <div class="flex gap-2">
        <input type="text" id="room-input" placeholder="Enter Room Code" class="flex-1 bg-slate-700 px-4 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 uppercase">
        <button id="join-btn" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-6 py-2 rounded-xl transition">Join</button>
      </div>
    </div>

    <!-- Game Container (Hidden initially) -->
    <div id="game-container" class="hidden">
      
      <!-- Scoreboard -->
      <div class="grid grid-cols-3 gap-2 mb-6 text-center bg-slate-900 rounded-xl p-3 shadow-inner">
        <div class="flex flex-col">
          <span class="text-xs text-slate-400 uppercase font-bold">Player X</span>
          <span id="score-x" class="text-2xl font-bold text-blue-400">0</span>
        </div>
        <div class="flex flex-col border-x border-slate-700">
          <span class="text-xs text-slate-400 uppercase font-bold">Draws</span>
          <span id="score-draws" class="text-2xl font-bold text-slate-300">0</span>
        </div>
        <div class="flex flex-col">
          <span class="text-xs text-slate-400 uppercase font-bold">Player O</span>
          <span id="score-o" class="text-2xl font-bold text-pink-400">0</span>
        </div>
      </div>

      <div class="flex justify-between items-center mb-4">
        <span id="player-indicator" class="font-semibold text-blue-300"></span>
        <span id="room-display" class="bg-slate-700 px-3 py-1 rounded text-sm font-mono tracking-widest cursor-pointer hover:bg-slate-600" title="Click to copy code"></span>
      </div>
      
      <!-- Dynamic Board -->
      <div id="board" class="grid gap-2 bg-slate-700 p-2 rounded-xl mx-auto w-full aspect-square max-h-[60vh]">
        <!-- Cells generated by JS -->
      </div>

      <button id="rematch-btn" class="w-full mt-6 bg-purple-600 hover:bg-purple-500 font-bold py-3 rounded-xl transition hidden">
        Play Next Round
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
